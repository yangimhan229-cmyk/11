name: Build LG G8 APK Extractor
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Check APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -6
      - uses: actions/upload-artifact@v4
        with:
          name: LGG8_APK_Extractor_v1.0
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LGG8_APK_Extractor_v1.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LGG8_APK_Extractor_v1.0.apk
          git commit -m "Build installable LGG8 APK Extractor v1.0" || exit 0
          git push origin HEAD:main
